<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>

<body>
  <div class="lrContainer">
    <div class="bannerHalf">
      <div class="exitBtn">
        <a href="./login.html"><img src="./assets/img/exitIcon.png" alt=""></a>
        <div id="div_erros_login"></div>
        <div class="alerta_erro">
          <div class="card_erro" id="cardErro">
            <span id="mensagem_erro"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="formHalf">
      <h1>Cadastre-se agora mesmo!</h1>
      <form action="">
        <div class="formGroup">
          <p>Nome de usuário:</p>
          <input type="text" placeholder="joao" id="nome_input">
        </div>
        <div class="formGroup">
          <p>Email:</p>
          <input type="text" placeholder="joao@gmail.com" id="email_input">
        </div>
        <div class="formGroup">
          <p>Senha</p>
          <input type="password" placeholder="******" id="senha_input">
        </div>
        <div class="formGroup">
          <p>Confirmar senha:</p>
          <input type="password" placeholder="******" id="confirmacao_senha_input">
        </div>
        <button type="button" onclick="cadastrar()">Cadastrar</button>
      </form>
    </div>
  </div>
</body>

</html>

<script>

  function cadastrar() {

    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Todos os campos devem sem preenchidos!";

      // finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (emailVar.length > 50 || emailVar.includes(" ") || !emailVar.includes("@") ||
      !emailVar.includes(".") || emailVar.lastIndexOf(".") < emailVar.lastIndexOf("@")) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Email inválido!";

      // finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    const reNum = new RegExp("[0-9]");

    if (senhaVar.length < 8 || !reNum.test(senhaVar)) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
      "A senha deve ter no mínimo 8 caracteres e um número!";
      return false
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if(senhaVar != confirmacaoSenhaVar){
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
      "As senhas não coincidem!";
      return false
    }else {
      setInterval(sumirMensagem, 5000);
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        // idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
