<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>LOGIN - RTC</title>
</head>

<body>
    <div class="lrContainer">
        <div class="bannerHalf">
            <div class="exitBtn">
                <a href="./index.html"><img src="./assets/img/exitIcon.png" alt=""></a>
            </div>
        </div>
        <div class="formHalf">
            <h1>Bem-vindo, novamente!</h1>
            <form action="">
                <div class="formGroup">
                    <p>Email:</p>
                    <input type="text" placeholder="joao@gmail.com" id="email_input">
                </div>
                <div class="formGroup">
                    <p>Senha</p>
                    <input type="password" placeholder="******" id="senha_input">
                </div>
                <p class="registerRedirect">Ainda não possui uma conta? <a href="./cadastro.html">Cadastre-se</a></p>
                <button type="button" onclick="entrar()">Entrar</button>
            </form>
        </div>
        <div id="div_erros_login"></div>
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <img src="./assets/img/mark.png" alt="">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="alerta_sucesso">
            <div class="card_sucesso" id="cardSucesso">
                <img src="./assets/img/check.png" alt="">
                <span id="mensagem_sucesso"></span>
            </div>
        </div>
    </div>
</body>

</html>
<script>


    function entrar() {
        // aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "flex"
            mensagem_erro.innerHTML = "Todos os campos devem ser preenchidos para realizar o login!";
            // finalizarAguardar();
            setInterval(sumirMensagem, 5000)
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.RECEITA = JSON.stringify(json.receita)

                    cardSucesso.style.display = "flex"
                    mensagem_sucesso.innerHTML = "Login realizado com sucesso!";
                    setInterval(sumirMensagem2, 5000)

                    setTimeout(function () {
                        window.location = "./dashboard/main.html";
                    }, 1000); // apenas para exibir o loading
                });

            } else {


                cardErro.style.display = "flex";
                mensagem_erro.innerHTML =
                    "E-mail ou senha inválidos!";
                return false

                setInterval(sumirMensagem, 5000);


                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

    function sumirMensagem2() {
        cardSucesso.style.display = "none"
    }

</script>
