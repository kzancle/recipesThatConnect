<body onload="exibirQtdReceita(), qtdTipo(), qtdOcasiao()">
  <div class="container">
    <header>

          <li>

            </a>

    </header>
    <main>
      <div class="content">
        <div class="greeting">
          <p>Olá, <span id="b_usuario"></span></p>

        <div class="boxKpi">
          <div class="kpi">

            <div class="value">
              <span class="legend" id="entradaLegend"></span><p>Entrada:</p><span id="outEntrada">0</span>
            </div>
            <div class="value">
              <span class="legend" id="pratoPrincipalLegend"></span><p>Prato Principal:</p><span id="outPratoPrincipal">0</span>
            </div>
            <div class="value">
              <span class="legend" id="sobremesaLegend"></span><p>Sobremesa:</p><span id="outSobremesa">0</span>
            </div>
            <div class="value">
              <span class="legend" id="bebidaLegend"></span><p>Bebida:</p><span id="outBebida">0</span>
            </div>
            <div class="value">
              <span class="legend" id="lancheLegend"></span><p>Lanche:</p><span id="outLanche">0</span>
            </div>
          </div>
          <div class="graphic">
            <canvas id="myChart"></canvas>
          </div>
        </div>
        <div class="boxKpi">
          <div class="kpi">
            <h2>Ocasiões</h2>
            <div class="value">
              <span class="legend" id="dataFestivaLegend"></span><p>Data Festiva:</p><span id="outComemorativa">0</span>
            </div>
            <div class="value">
              <span class="legend" id="diaDiaLegend"></span><p>Dia a Dia:</p><span id="outDiaDia">0</span>
            </div>
            <div class="value">
              <span class="legend" id="fitnessLegend"></span><p>Fitness:</p><span id="outFitness">0</span>
            </div>
            <div class="value">
              <span class="legend" id="dateLegend"></span><p>Date:</p><span id="outDate">0</span>
            </div>
            <div class="value">
              <span class="legend" id="outroLegend"></span><p>Outro:</p><span id="outOutro">0</span>
            </div>
          </div>
          <div class="graphic">
            <canvas id="myChart2"></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
<script>

  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

  let resultadosTipo = []
  async function qtdTipo() {

    console.log(sessionStorage.ID_USUARIO)

    let vetorTipo = ['Entrada', 'Prato Principal', 'Sobremesa', 'Bebida', 'Lanche']

    for (let i = 0; i < vetorTipo.length; i++) {

      const resposta =
        await fetch(`/kpis/tipo/${vetorTipo[i]}/${sessionStorage.ID_USUARIO}`,
          {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
            },
          }
        );

      console.log("resposta: ", resposta);

      if (!resposta.ok) {
        throw "Houve um erro";
      }

      console.log("Deu certo");

      const json = await resposta.json();

      resultadosTipo.push(json[0].quantidade);

      console.log(resultadosTipo);
    }

    const ctx1 = document.getElementById('myChart');

    new Chart(ctx1, {
      type: 'doughnut',
      data: {
        labels: ['Entrada', 'Prato Principal', 'Sobremesa', 'Bebida', 'Lanche'],
        datasets: [{
          label: 'Quantidade de receitas',
          data: [resultadosTipo[0], resultadosTipo[1], resultadosTipo[2], resultadosTipo[3], resultadosTipo[4]],
          backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'],
          borderWidth: 1
        }]
      },
      options: {
        plugins: {
          legend: {
            position: 'bottom'
          }
        }
      }
    });

    outEntrada.innerHTML = resultadosTipo[0]
    outPratoPrincipal.innerHTML = resultadosTipo[1]
    outSobremesa.innerHTML = resultadosTipo[2]
    outBebida.innerHTML = resultadosTipo[3]
    outLanche.innerHTML = resultadosTipo[4]
  }

  let resultadosOcasiao = []

    console.log(sessionStorage.ID_USUARIO)

    let vetorOcasiao = ['Data Festiva', 'Dia a Dia', 'Fitness', 'Date', 'Outro']
