<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/dash.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="container">
        <header>
            <div class="navbar">
                <ul>
                    <li>
                        <a href="./main.html">
                            <img src="../assets/img/home.png" alt="">
                        </a>
                    </li>
                    <li>
                        <a href="./addRecipe.html">
                            <img src="../assets/img/plus.png" alt="">
                        </a>
                    </li>
                    <li>
                        <a href="./showRecipes.html">
                            <img src="../assets/img/hearthBook.png" alt="">
                        </a>
                    </li>
                </ul>
                <a href="../login.html" class="exit">
                    <img src="../assets/img/out.png" alt="">
                </a>
            </div>
        </header>
        <main>
            <div class="content">
                <div class="greeting">
                    <p>Olá, <span id="b_usuario"></span>.    Você tem <span>qtdReceitas</span> receitas cadastradas no momento!</p>
                </div>
                <div class="kpiBox">
                    <div class="kpi">
                        <p>Entrada</p>
                        <p>0</p>
                    </div>
                    <div class="kpi">
                        <p>Prato Principal</p>
                        <p>0</p>
                    </div>
                    <div class="kpi">
                        <p>Sobremesa</p>
                        <p>0</p>
                    </div>
                    <div class="kpi">
                        <p>Bebida</p>
                        <p>0</p>
                    </div>
                    <div class="kpi">
                        <p>Lanche</p>
                        <p>0</p>
                    </div>
                </div>
                <div class="graphics">
                    <div class="tipoGraph">
                        <canvas id="myChart"></canvas>
                    </div>
                    <div class="ocasiaoGraph">
                        <canvas id="myChart2"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
<script>
    const ctx1 = document.getElementById('myChart');
    const ctx2 = document.getElementById('myChart2');

new Chart(ctx1, {
  type: 'doughnut',
  data: {
    labels: ['Entrada', 'Prato Principal', 'Sobremesa', 'Bebida', 'Lanche'],
    datasets: [{
      label: 'Quantidade de receitas',
      data: [5, 5, 5, 5,5],
      backgroundColor: [
        '#FF6384',
        '#36A2EB',
        '#FFCE56',
        '#4BC0C0',
        '#FFCE56'
      ],
      borderWidth: 1
    }]
  },
  options: {
    plugins: {
      legend: {
        position: 'bottom'
      }
    }
  }
});

new Chart(ctx2, {
  type: 'doughnut',
  data: {
    labels: ['Data Comemorativa', 'Dia a Dia', 'Fitness', 'Date', 'Outro'],
    datasets: [{
      label: 'Quantidade de receitas',
      data: [5, 5, 5, 5,5],
      backgroundColor: [
        '#FF6384',
        '#36A2EB',
        '#FFCE56',
        '#4BC0C0',
        '#FFCE56'
      ],
      borderWidth: 1
    }]
  },
  options: {
    plugins: {
      legend: {
        position: 'bottom'
      }
    }
  }
});

b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
</script>
