<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/dash.css">
    <title>CADASTRO RECEITA - RTC</title>
</head>

<body>

    <div class="container">
        <header>
            <div class="navbar">
                <ul>
                    <li>
                        <a href="./main.html">
                            <img src="../assets/img/home.png" alt="">
                        </a>
                    </li>
                    <li>
                        <a href="./addRecipe.html">
                            <img src="../assets/img/plus.png" alt="">
                        </a>
                    </li>
                    <li>
                        <a href="./showRecipes.html">
                            <img src="../assets/img/hearthBook.png" alt="">
                        </a>
                    </li>
                </ul>
                <a class="exit" onclick="limparSessao()">
                    <img src="../assets/img/out.png" alt="">
                </a>
            </div>
        </header>
        <main class="addRecipeDelimiter">
            <div id="div_erros_login"></div>
            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <img src="../assets/img/mark.png" alt="">
                    <span id="mensagem_erro"></span>
                </div>
            </div>
            <div class="alerta_sucesso">
                <div class="card_sucesso" id="cardSucesso">
                    <img src="../assets/img/check.png" alt="">
                    <span id="mensagem_sucesso"></span>
                </div>
            </div>
            <div class="formContainer">
                <h1>Cadastre uma nova receita</h1>
                <form>
                    <div class="iptBox">
                        <p>Nome</p>
                        <input type="text" id="inputNome">
                    </div>
                    <div class="selectsBox">
                        <div class="select">
                            <p>Tipo</p>
                            <select id="selectTipo">
                                <option value="entrada">Entrada</option>
                                <option value="prato principal">Prato Principal</option>
                                <option value="sobremesa">Sobremesa</option>
                                <option value="bebida">Bebida</option>
                                <option value="lanche">Lanche</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>
                        <div class="select">
                            <p>Ocasião</p>
                            <select id="selectOcasiao">
                                <option value="dia a dia">Dia a dia</option>
                                <option value="fitness">Fitness</option>
                                <option value="date">Date</option>
                                <option value="data festiva">Data Festiva</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>
                    </div>
                    <div class="ingredientBox">
                        <p>Ingredientes</p>
                        <div class="ingredientInputs">
                            <div class="boxIng">
                                <span>Nome</span>
                                <input type="text" id="ingredienteInput" placeholder="ex: fermento">
                            </div>
                            <div class="boxIng">
                                <span>Quantidade</span>
                                <input type="number" id="quantidadeInput" placeholder="ex: 1">
                            </div>
                            <div class="boxIng">
                                <span>Unidade de Medida</span>
                                <select id="unidadeInput">
                                    <option value="unidade">Unidade</option>
                                    <option value="ml">ml</option>
                                    <option value="L">L</option>
                                    <option value="g">g</option>
                                    <option value="kg">kg</option>
                                    <option value="mg">mg</option>
                                    <option value="xicara">xícara</option>
                                    <option value="colher de sopa">colher de sopa</option>
                                    <option value="colher de cha">colher de chá</option>
                                    <option value="colher de sobremesa">colher de sobremesa</option>
                                </select>
                            </div>
                            <button type="button" onclick="inserirIngredienteNoJson()">Inserir</button>
                        </div>
                        <div class="ingredientsInserted">
                            <p>Ingredientes cadastrados:</p>
                            <div id="ingredientsOutput">
                            </div>
                        </div>
                    </div>
                    <div class="modoPreparo">
                        <p>Modo de preparo</p>
                        <textarea type="text" id="inputPreparo" placeholder="Primeiro..." oninput="caracteresRestante(inputPreparo.value)"></textarea>
                        <span>Caracteres Restantes: </span><span id="restanteCaracteres"></span>
                    </div>
                    <button type="button" onclick="cadastrar()" id="cadastroReceiraBtn">CADASTRAR</button>
                </form>
            </div>
        </main>
        <footer>
        </footer>
    </div>
</body>

</html>
<script>
    let jsonIngredientes = []
    function inserirIngredienteNoJson() {
        let nome = ingredienteInput.value
        let quantidade = Number(quantidadeInput.value)
        let unidadeMedida = unidadeInput.value

        if (nome == "" || quantidade == "" || unidadeMedida == "") {
            cardErro.style.display = "flex";
            mensagem_erro.innerHTML =
                "Todos os campos devem ser preenchidos para inserir um ingrediente!";
            setInterval(sumirMensagem, 4000);
            return false
        }
        ingredientsOutput.innerHTML = ""
        jsonIngredientes.push(
            {
                "nome": nome,
                "quantidade": quantidade,
                "unidadeMedida": unidadeMedida
            }
        )
        for (let i = 0; i < jsonIngredientes.length; i++) {
            ingredientsOutput.innerHTML += `<p>${jsonIngredientes[i].nome}<p>, `

        }
    }

    async function cadastrar() {
        //RECEITA
        var nome = inputNome.value;
        var tipo = selectTipo.value;
        var ocasiao = selectOcasiao.value;
        var modoPreparo = inputPreparo.value;
        var idUsuario = sessionStorage.ID_USUARIO;
        let idReceitaCadastrada
        let idIngredienteCadastrado
        let idIngredienteReceita

        if (nome == "" && jsonIngredientes.length < 1) {
            cardErro.style.display = "flex";
            mensagem_erro.innerHTML =
                "A receita deve ter um nome e ingredientes!";
            setInterval(sumirMensagem, 4000);
            return false
        }
        else if (nome == "") {
            cardErro.style.display = "flex";
            mensagem_erro.innerHTML =
                "A receita deve ter um nome!";
            setInterval(sumirMensagem, 4000);
            return false
        }
        else if (jsonIngredientes.length < 1) {
            cardErro.style.display = "flex";
            mensagem_erro.innerHTML =
                "A receita deve ter ingredientes!";
            setInterval(sumirMensagem, 4000);
            return false
        }
        else if (modoPreparo.length > 255) {
            cardErro.style.display = "flex";
            mensagem_erro.innerHTML =
                "O modo de preparo deve ter no máximo 400 caracteres!";
            setInterval(sumirMensagem, 4000);
            return false
        }


        await fetch("/receita/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nome: nome,
                tipo: tipo,
                ocasiao: ocasiao,
                modoPreparo: modoPreparo,
                idUsuario: idUsuario

            })
        })
            .then(function (resposta) {
                console.log(resposta);
                if (resposta.ok) {
                    console.log("Receita cadastrada com sucesso!");
                    return resposta.json();
                } else {
                    console.log("Erro ao cadastrar receita!");
                }
            })

            .then(function (json) {
                idReceitaCadastrada = json.insertId;
                console.log(`ID DA RECEITA CADASTRADA: ${idReceitaCadastrada}`);

            })
            .catch(function (erro) {
                console.log(erro);
            });


        for (let i = 0; i < jsonIngredientes.length; i++) {

            const getIngrediente = await fetch(`/ingrediente/buscar/${jsonIngredientes[i].nome}`, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json"
                },
            })
            console.log(getIngrediente)
            let jsonGetIngrediente = [];

            if (getIngrediente.status != 204) {
                jsonGetIngrediente = await getIngrediente.json();
            }

            if (jsonGetIngrediente.length > 0) {
                idIngredienteCadastrado = jsonGetIngrediente[0].id;
            } else {

                await fetch("/ingrediente/cadastrar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome: jsonIngredientes[i].nome,

                    })
                })
                    .then(function (resposta) {
                        console.log(resposta);
                        if (resposta.ok) {
                            console.log("Ingrediente cadastrado com sucesso!");
                            return resposta.json();
                        } else {
                            console.log("Erro ao cadastrar Ingrediente!");
                        }
                    })

                    .then(function (json) {
                        idIngredienteCadastrado = json.insertId;
                        console.log(`ID DO INGREDIENTE CADASTRADO: ${idIngredienteCadastrado}`);

                    })
                    .catch(function (erro) {
                        console.log(erro);
                    });
            }




            await fetch("/receitaIngrediente/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    idReceita: idReceitaCadastrada,
                    idIngrediente: idIngredienteCadastrado,
                    quantidade: jsonIngredientes[i].quantidade,
                    unidadeQtd: jsonIngredientes[i].unidadeMedida
                })
            })
                .then(function (resposta) {
                    console.log(resposta);
                    if (resposta.ok) {
                        console.log("Linkado no NN com sucesso!");
                        return resposta.json();
                    } else {
                        console.log("Erro ao linkar no NN!");
                    }
                })
                .catch(function (erro) {
                    console.log(erro);
                });
        }
        cardSucesso.style.display = "flex"
        mensagem_sucesso.innerHTML = "Receita cadastrada com sucesso!";
        setInterval(sumirMensagem2, 2000)
        jsonIngredientes = []

        setTimeout(function () {
            window.location = "./showRecipes.html";
        }, 4000);
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }

    function sumirMensagem2() {
        cardSucesso.style.display = "none"
    }

    function caracteresRestante(item){
        let restante = 400-item.length
        if(restante <= 0){
            restanteCaracteres.innerHTML = `Limite de caracteres atingido! Elimine ${item.length-400} caracteres`
        }else{
            restanteCaracteres.innerHTML = restante
        }
    }
</script>
