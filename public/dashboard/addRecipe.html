<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/dash.css">
    <title>Cadastrar Receita</title>
</head>

<body>

    <div class="container">
        <header>
            <div class="navbar">
                <ul>
                    <li>
                        <a href="./main.html">
                            <img src="../assets/img/home.png" alt="">
                        </a>
                    </li>
                    <li>
                        <a href="./addRecipe.html">
                            <img src="../assets/img/plus.png" alt="">
                        </a>
                    </li>
                    <li>
                        <a href="./showRecipes.html">
                            <img src="../assets/img/hearthBook.png" alt="">
                        </a>
                    </li>
                </ul>
                <a class="exit" onclick="limparSessao()">
                    <img src="../assets/img/out.png" alt="">
                </a>
            </div>
        </header>
        <main class="addRecipeDelimiter">
            <div class="formContainer">
                <h1>Cadastre uma nova receita</h1>
                <form>
                    <div class="iptBox">
                        <p>Nome</p>
                        <input type="text" id="inputNome">
                    </div>
                    <div class="selectsBox">
                        <div class="select">
                            <p>Tipo</p>
                            <select id="selectTipo">
                                <option value="entrada">Entrada</option>
                                <option value="prato principal">Prato Principal</option>
                                <option value="sobremesa">Sobremesa</option>
                                <option value="bebida">Bebida</option>
                                <option value="lanche">Lanche</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>
                        <div class="select">
                            <p>Ocasião</p>
                            <select id="selectOcasiao">
                                <option value="dia a dia">Dia a dia</option>
                                <option value="fitness">Fitness</option>
                                <option value="date">Date</option>
                                <option value="data comemorativa">Data comemorativa</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>
                    </div>
                    <div class="ingredientBox">
                        <p>Ingrediente</p>
                        <div class="ingredientInputs">
                            <input type="text" id="ingredienteInput">
                            <select>
                                <option value="">Quantidade</option>
                            </select>
                            <select>
                                <option value="">Unidade de medida</option>
                            </select>
                            <button type="button" onclick="cadastrarIngrediente()">Inserir</button>
                        </div>
                        <div class="ingredientsInserted">
                            <p>Ingredientes cadastrados:</p>
                            <div class="ingredientsOutput">
                            </div>
                        </div>
                    </div>
                    <div class="modoPreparo">
                        <p>Modo de preparo</p>
                        <input type="text">
                    </div>
                    <button type="button" onclick="cadastrarReceita()">CADASTRAR</button>
                </form>
            </div>
        </main>
        <footer>
        </footer>
    </div>
</body>
</html>
<script>
    function cadastrarReceita() {

        var nome = inputNome.value;
        var tipo = selectTipo.value;
        var ocasiao = selectOcasiao.value;
        var idUsuario = sessionStorage.ID_USUARIO;

        fetch("/receita/cadastrar", {

            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                nome: nome,
                tipo: tipo,
                ocasiao: ocasiao,
                idUsuario: idUsuario

            })
        })

            .then(function (resposta) {
                console.log(resposta);
                if (resposta.ok) {
                    alert("Receita cadastrada com sucesso!");
                    inputNome.value = "";
                } else {
                    alert("Erro ao cadastrar receita!");
                }
            })
            .catch(function (erro) {

                console.log(erro);

            });
    }

     function cadastrarIngrediente() {

        var nome = ingredienteInput.value
        console.log(nome)

        fetch("/ingrediente/cadastrar", {

            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                nome: nome

            })
        })

            .then(function (resposta) {
                console.log(resposta);
                if (resposta.ok) {
                    alert("Ingrediente cadastrado com sucesso!");
                    ingredienteInput.value = "";
                } else {
                    alert("Erro ao cadastrar ingrediente!");
                }
            })
            .catch(function (erro) {

                console.log(erro);

            });
    }
</script>
