            <div class="navbar">

                    <li>

                <div class="recipeBox">
                    <div class="recipe">
                        <a href="">

                        </a>
                    </div>
                    
                </div>

<script src="../js/sessao.js"></script>
<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function exibirReceita() {
        JSON.parse(sessionStorage.RECEITA).forEach(item => {
            document.getElementById("recipeBox").innerHTML += `

                    <div class="recipe">
                        <a href="">
                            <img src="../assets/img/dottedmenu.png" alt="">
                            <p>${item.nome}</p>
                        </a>
                    </div>`
        });
    }
</script>
